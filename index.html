<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #c {
            width: 100%;
            height: 100%;
            display: block;
        }

        #info {
            position: absolute;
            left: 1em;
            top: 1em;
            background: rgba(0, 0, 0, .8);
            padding: .5em;
            color: white;
            font-family: monospace;
        }


        #stage {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 240px;
        }

        #stage video,
        #stage canvas {
            display: block;
            width: 100%;
        }

        #stage canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="stage">
        <video></video>
        <canvas id="overlay"></canvas>
        <div id="shotBanner" hidden>SHOT!</div>
        <pre id="readout">waiting for the camera and the model…</pre>
    </div>
   
    <canvas id="c"></canvas>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
