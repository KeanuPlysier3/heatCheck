<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heatCheck</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #c {
            width: 100%;
            height: 100%;
            display: block;
        }

        #info {
            position: absolute;
            left: 1em;
            top: 1em;
            background: rgba(0, 0, 0, .8);
            padding: .5em;
            color: white;
            font-family: monospace;
        }


        #stage {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 240px;
        }

        #stage video,
        #stage canvas {
            display: block;
            width: 100%;
        }

        #stage canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #stats {
            position: absolute;
            max-width: fit-content;
            max-height: fit-content;
            top: 0;
            left: 0;
            right: 16px;
            bottom: 16px;
            background: rgba(0, 0, 0, .8);
            padding: .5em;
            color: white;
            font-family: monospace;
        }

        #meter {
            position: fixed;
            right: 1%;
            /* to the right of the player, on screen */
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 500px;
            background: #1b1030ec;
            /* the outline colour */
            border: 4px solid #1B1030;
            border-radius: 12px;
            overflow: hidden;
            /* the fill can't spill past the rounded corners */
        }

        #meterGreen,
        #meterFill {
            position: absolute;
            left: 0;
            width: 100%;
        }

        #meterGreen {
            background: #B6F500;
            /* the palette's lime accent */
            /* bottom and height are set from the Meter constants, in JavaScript */
        }

        #meterFill {
            bottom: 0;
            height: 0%;
            /* JavaScript changes this every frame */
            background: #FFF1D0;
            /* cream */
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div id="stage">
        <video></video>
        <canvas id="overlay"></canvas>
        <div id="shotBanner" hidden>SHOT!</div>
        <pre id="readout">waiting for the camera and the model…</pre>
    </div>

    <div id="stats">
        <p>Shots: <span id="shots">0</span></p>
        <p>Made Shots: <span id="madeShots">0</span></p>
        <p>Shooting Percentage: <span id="shootingPercentage">0%</span></p>
    </div>

    <div id="meter" >
        <div id="meterGreen"></div>
        <div id="meterFill"></div>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
